<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ShopNow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="logo-icon">🔑</span>
                <h2>Reset Your Password</h2>
                <p>Enter your registered email address and we'll send you a password reset link.</p>
            </div>

            <div id="forgotAlert" class="alert-message hidden"></div>

            <form id="forgotForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="forgotEmail">Email Address <span class="required">*</span></label>
                    <input type="email" id="forgotEmail" name="email" placeholder="john@example.com" required>
                </div>

                <button type="submit" id="forgotSubmitBtn" class="btn-primary btn-full">Send Password Reset Link</button>

                <div class="auth-footer" style="margin-top: 20px;">
                    <p>Remember your password? <a href="login.html">Sign In</a></p>
                    <p style="margin-top: 8px;"><a href="index.html">&larr; Return to Storefront</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('forgotForm');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('forgotEmail').value.trim();
                const btn = document.getElementById('forgotSubmitBtn');

                if (!email) {
                    showAlert('forgotAlert', 'Please enter your email address.', 'error');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Sending link...';

                const res = await apiFetch('/auth/forgot-password', 'POST', { email });
                btn.disabled = false;
                btn.textContent = 'Send Password Reset Link';

                if (res && res.success) {
                    showAlert('forgotAlert', res.message, 'success');
                    form.reset();
                } else {
                    showAlert('forgotAlert', res ? res.message : 'Could not process request.', 'error');
                }
            });
        });
    </script>
</body>
</html>
