<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - ShopNow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="logo-icon">🔒</span>
                <h2>Choose a New Password</h2>
                <p>Must be at least 8 characters with uppercase, lowercase, digit, and symbol.</p>
            </div>

            <div id="resetAlert" class="alert-message hidden"></div>

            <form id="resetPasswordForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="newPassword">New Password <span class="required">*</span></label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Minimum 8 characters" required>
                    <span id="newPasswordError" class="error-text"></span>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password <span class="required">*</span></label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter new password" required>
                    <span id="confirmNewPasswordError" class="error-text"></span>
                </div>

                <button type="submit" id="resetSubmitBtn" class="btn-primary btn-full">Update Password</button>

                <div class="auth-footer" style="margin-top: 20px;">
                    <a href="login.html">&larr; Return to Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = getUrlParam('token');
            const form = document.getElementById('resetPasswordForm');
            const btn = document.getElementById('resetSubmitBtn');

            if (!token) {
                showAlert('resetAlert', 'Missing password reset token in URL.', 'error');
                if (btn) btn.disabled = true;
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const pwd = document.getElementById('newPassword').value;
                const confirm = document.getElementById('confirmNewPassword').value;

                document.getElementById('newPasswordError').textContent = '';
                document.getElementById('confirmNewPasswordError').textContent = '';

                if (pwd.length < 8) {
                    document.getElementById('newPasswordError').textContent = 'Password must be at least 8 characters.';
                    return;
                }

                if (pwd !== confirm) {
                    document.getElementById('confirmNewPasswordError').textContent = 'Passwords do not match.';
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Updating Password...';

                const res = await apiFetch('/auth/reset-password', 'POST', {
                    token: token,
                    newPassword: pwd
                });

                btn.disabled = false;
                btn.textContent = 'Update Password';

                if (res && res.success) {
                    showAlert('resetAlert', 'Password reset successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    showAlert('resetAlert', res ? res.message : 'Failed to reset password.', 'error');
                }
            });
        });
    </script>
</body>
</html>
